# TEST profile (schema v2) — brokers SWAPPED (slot 0 = mqtt2, slot 1 = mqtt1)
# vs the standard profile, so applying one then the other shows change rows both
# ways. No secrets, no broker enabled. Not for real use.
#
# The swap is HOST-ONLY: slot 0 stays plaintext/tcp and slot 1 stays wss/TLS.
# Slot 0's transport is load-bearing (a tcp broker is exempt from the firmware's
# TLS rotation, which is what makes it the always-on primary), so a test profile
# must never move slot 0 onto TLS — applying it would silently demote a real
# device's primary into the rotating pool.

schema_version: 2
name: OKIMesh brokers swapped (TEST)

mqtt:
  brokers:
    - slot: 0
      url: mqtt://mqtt2.okimesh.org:1883
      port: 1883
      transport: tcp
      auth_type: none
      topic_prefix: meshcore
    - slot: 1
      url: wss://mqtt1.okimesh.org:9002/mqtt
      port: 9002
      transport: wss
      auth_type: none
      ca_cert: letsencrypt
      topic_prefix: meshcore
