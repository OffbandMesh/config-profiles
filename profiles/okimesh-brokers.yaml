# OKIMesh — standard MQTT brokers (schema v2, sectioned)
# The two OKIMesh MQTT brokers, standard order. Anonymous TCP, no secrets.
# Mirrors the meshcore-firmware default Observer config (ConfigSchema.cpp 0-1).
#
# No region — mqtt.iata is per-operator-location; set your own on the device.
# No broker `enabled` — enabling is the operator's call; apply preserves the
# device's current enabled state (#456).

schema_version: 2
name: OKIMesh — standard MQTT brokers

mqtt:
  brokers:
    - slot: 0
      url: mqtt://mqtt1.okimesh.org:1883
      port: 1883
      transport: tcp
      auth_type: none
      topic_prefix: meshcore
    - slot: 1
      url: mqtt://mqtt2.okimesh.org:1883
      port: 1883
      transport: tcp
      auth_type: none
      topic_prefix: meshcore
