# Radio presets: validate on every change, and mirror MeshCore's upstream list daily.
#
# The mirror job fetches https://api.meshcore.nz/api/v1/config (MeshCore's preset list,
# maintained by Liam Cottle), validates it together with the overlay, and commits
# radio-presets/meshcore-upstream.json straight to main only when the presets changed. A
# fetch failure, a shape change or a title clash fails the run and commits nothing, so
# the last good mirror stays in place.
name: Radio presets

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radio-presets/**", "scripts/*radio_presets*.py", "scripts/mirror_meshcore_presets.py", ".github/workflows/radio-presets.yml"]
  pull_request:
    paths: ["radio-presets/**", "scripts/*radio_presets*.py", "scripts/mirror_meshcore_presets.py", ".github/workflows/radio-presets.yml"]

permissions:
  contents: read

concurrency:
  group: radio-presets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both preset files
        run: python3 scripts/validate_radio_presets.py

  mirror:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate the upstream list
        run: python3 scripts/mirror_meshcore_presets.py
      - name: Check for changes
        id: diff
        run: |
          git add radio-presets/meshcore-upstream.json
          if git diff --cached --quiet; then
            echo "Mirror unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Before the commit, so main always passes its own validation. If a new upstream
      # title clashes with one in offband.json, the run fails and nothing is committed;
      # fix it in offband.json (set overrides_upstream, or retire ours) and rerun.
      - name: Validate the overlay against the new mirror
        if: steps.diff.outputs.changed == 'true'
        run: python3 scripts/validate_radio_presets.py
      - name: Commit the mirror
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mirror MeshCore radio presets from api.meshcore.nz"
          git push origin HEAD:main
