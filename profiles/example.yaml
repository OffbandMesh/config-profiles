# Example Offband config profile (schema v2 — capability sections).
# Safe to inspect; sets a region + one demo broker, NO secrets.
# See ../SCHEMA.md for the full field list.

schema_version: 2
name: Example profile

# wifi section — any wifi-capable device. Commented so the example applies
# nothing sensitive.
# wifi:
#   ssid: your-ssid
#   password: your-password      # a shared profile should NOT carry real secrets
#   enabled: true

# mqtt section — observer/MQTT capability (region + brokers).
mqtt:
  region: IAD                    # -> mqtt.iata (per-location; omit in org-wide profiles)
  status_interval: 60
  brokers:
    - slot: 0
      enabled: true
      url: mqtt.example.org
      port: 8883
      transport: tls             # tcp | tls | wss
      auth_type: basic           # none | basic | jwt
      username: example-user
      # password: set on-device; do not commit real secrets to a shared profile
      topic_prefix: meshcore
