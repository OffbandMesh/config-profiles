# TEST profile (schema v2) — brokers SWAPPED (slot 0 = mqtt2, slot 1 = mqtt1)
# vs the standard profile, so applying one then the other shows change rows both
# ways. Anonymous wss/TLS (firmware #592 form), no secrets, no broker enabled.
# Not for real use.

schema_version: 2
name: OKIMesh brokers swapped (TEST)

mqtt:
  brokers:
    - slot: 0
      url: wss://mqtt2.okimesh.org:9002/mqtt
      port: 9002
      transport: wss
      auth_type: none
      ca_cert: letsencrypt
      topic_prefix: meshcore
    - slot: 1
      url: wss://mqtt1.okimesh.org:9002/mqtt
      port: 9002
      transport: wss
      auth_type: none
      ca_cert: letsencrypt
      topic_prefix: meshcore
